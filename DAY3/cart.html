<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">E-Commerce</a>
        <a href="index.html" class="back-link">Continue Shopping</a>
    </header>

    <main>
        <h1>Your Cart</h1>

        <div id="cart-container"></div>

        <div class="cart-summary">
            <h2>Cart Summary</h2>

            <div class="summary-row">
                <span>Total Items:</span>
                <span id="cart-items">0</span>
            </div>

            <div class="summary-row total">
                <span>Total:</span>
                <span>₹<span id="cart-total">0</span></span>
            </div>

            <button id="checkout-btn" onclick="checkout()">
                Checkout
            </button>

            <button class="clear-btn" onclick="clearCart()">
                Clear Cart
            </button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 E-Commerce. All Rights Reserved.</p>
    </footer>

    <script src="cart.js"></script>
</body>
</html>
